services:
  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy with TLS termination (TECH-15)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Backend — Express API (TECH-2)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: development
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend — Vite + Vue.js dev server (TECH-3)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MongoDB — Standalone (TECH-9)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    driver: local
